syntax = "proto3";

package doravota.pqcauth.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "doravota/pqcauth/v1/state.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/DoraFactory/doravota/x/pqcauth/types";
option (gogoproto.equal_all) = true;

// Msg defines the pqcauth transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterKey(MsgRegisterKey) returns (MsgRegisterKeyResponse);
  rpc RotateKey(MsgRotateKey) returns (MsgRotateKeyResponse);
  rpc RotateRecoveryKey(MsgRotateRecoveryKey) returns (MsgRotateRecoveryKeyResponse);
  rpc SetProtection(MsgSetProtection) returns (MsgSetProtectionResponse);
  rpc RevokeKey(MsgRevokeKey) returns (MsgRevokeKeyResponse);
  rpc RecoverKey(MsgRecoverKey) returns (MsgRecoverKeyResponse);
  rpc CancelRecovery(MsgCancelRecovery) returns (MsgCancelRecoveryResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegisterKey atomically registers distinct signing and recovery keys. Both
// keys and self-enforcement become effective at the next block height.
message MsgRegisterKey {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgRegisterKey";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_signing_key_id = 2;
  Algorithm signing_algorithm = 3;
  bytes signing_public_key = 4;
  bytes signing_key_proof = 5;
  // Must be true in v1. Retained on the wire for explicit intent and stable
  // message encoding.
  bool self_enforce = 6;
  Algorithm recovery_algorithm = 7;
  bytes recovery_public_key = 8;
  bytes recovery_key_proof = 9;
}

message MsgRegisterKeyResponse {
  uint64 signing_key_id = 1;
  uint64 recovery_key_id = 2;
  uint64 effective_height = 3;
  uint64 policy_version = 4;
}

// MsgRotateKey proposes a replacement signing key. The current transaction
// remains authorized by the old key and the new key supplies proof of possession.
message MsgRotateKey {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgRotateKey";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_new_key_id = 2;
  Algorithm new_algorithm = 3;
  bytes new_public_key = 4;
  bytes new_key_proof = 5;
}

message MsgRotateKeyResponse {
  uint64 new_key_id = 1;
  uint64 effective_height = 2;
  uint64 policy_version = 3;
}

// MsgRotateRecoveryKey proposes a replacement offline recovery key. The
// transaction is authorized by the current signing key and the replacement key
// supplies proof of possession. The change becomes effective at H+1.
message MsgRotateRecoveryKey {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgRotateRecoveryKey";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_new_key_id = 2;
  Algorithm new_algorithm = 3;
  bytes new_public_key = 4;
  bytes new_key_proof = 5;
}

message MsgRotateRecoveryKeyResponse {
  uint64 new_key_id = 1;
  uint64 effective_height = 2;
  uint64 policy_version = 3;
}

// MsgSetProtection enables or disables per-account PQC enforcement at H+1.
message MsgSetProtection {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgSetProtection";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool enabled = 2;
}

message MsgSetProtectionResponse {
  uint64 effective_height = 1;
  uint64 policy_version = 2;
}

// MsgRevokeKey permanently revokes a non-active key.
message MsgRevokeKey {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgRevokeKey";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 key_id = 2;
}

message MsgRevokeKeyResponse {}

// MsgRecoverKey replaces the signing key using the registered recovery key.
message MsgRecoverKey {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgRecoverKey";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 recovery_key_id = 2;
  bytes recovery_signature = 3;
  uint64 expected_new_signing_key_id = 4;
  Algorithm new_signing_algorithm = 5;
  bytes new_signing_public_key = 6;
  bytes new_signing_key_proof = 7;
  // Binds the offline recovery authorization to the immutable challenge
  // period expected by the signer. Ante and MsgServer reject a mismatch.
  uint64 expected_recovery_delay_blocks = 8;
}

message MsgRecoverKeyResponse {
  uint64 new_signing_key_id = 1;
  uint64 effective_height = 2;
  uint64 policy_version = 3;
  uint64 request_height = 4;
}

// MsgCancelRecovery cancels a delayed recovery before its activation height.
// The normal pqcauth transaction extension must be signed by the current
// signing key, in addition to the owner's classic SDK signature.
message MsgCancelRecovery {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "pqcauth/MsgCancelRecovery";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 expected_pending_signing_key_id = 2;
  uint64 expected_pending_policy_version = 3;
}

message MsgCancelRecoveryResponse {
  uint64 cancelled_signing_key_id = 1;
  uint64 policy_version = 2;
}

// MsgUpdateParams updates bounded module parameters through governance.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "pqcauth/MsgUpdateParams";
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {
  uint64 activation_height = 1;
}
