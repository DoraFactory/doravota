syntax = "proto3";

package doravota.pqcauth.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/DoraFactory/doravota/x/pqcauth/types";
option (gogoproto.equal_all) = true;

// Algorithm identifies a post-quantum signature algorithm.
enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_ML_DSA_65 = 1;
}

// EnforcementMode controls which accounts must include valid PQC authorization.
enum EnforcementMode {
  ENFORCEMENT_MODE_UNSPECIFIED = 0;
  ENFORCEMENT_MODE_DISABLED = 1;
  ENFORCEMENT_MODE_OPTIONAL = 2;
  ENFORCEMENT_MODE_REQUIRED_FOR_REGISTERED = 3;
  ENFORCEMENT_MODE_REQUIRED = 4;
}

// EmergencyMode is a governance-controlled circuit breaker.
enum EmergencyMode {
  EMERGENCY_MODE_UNSPECIFIED = 0;
  EMERGENCY_MODE_NORMAL = 1;
  EMERGENCY_MODE_PAUSE_NEW_KEYS = 2;
  EMERGENCY_MODE_PAUSE_PQC_TRANSACTIONS = 3;
}

// RegistrationMode controls which classic accounts may bootstrap pqcauth.
// Transitions are monotonic: OPEN -> FRESH_ACCOUNTS_ONLY -> CLOSED.
enum RegistrationMode {
  REGISTRATION_MODE_UNSPECIFIED = 0;
  REGISTRATION_MODE_OPEN = 1;
  REGISTRATION_MODE_FRESH_ACCOUNTS_ONLY = 2;
  REGISTRATION_MODE_CLOSED = 3;
}

// KeyRole separates transaction-signing keys from recovery keys.
enum KeyRole {
  KEY_ROLE_UNSPECIFIED = 0;
  KEY_ROLE_SIGNING = 1;
  KEY_ROLE_RECOVERY = 2;
}

// KeyStatus records an irreversible lifecycle state. Height windows determine
// whether a non-revoked key is currently effective.
enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  KEY_STATUS_LIVE = 1;
  KEY_STATUS_REVOKED = 2;
}

// Params are bounded consensus parameters for the pqcauth module.
message Params {
  EnforcementMode enforcement_mode = 1;
  bytes network_id = 2;
  repeated Algorithm allowed_algorithms = 3;
  uint64 signature_verification_gas = 4;
  uint64 proof_verification_gas = 5;
  uint32 max_pqc_signers = 6;
  uint32 max_pqc_auth_bytes = 7;
  // Maximum number of complete terminal key records retained per role and
  // account. Current and pending policy keys are pinned and never count toward
  // this limit. Older terminal records are committed into AccountKeyHistory.
  uint32 max_retained_key_records_per_role = 8;
  // Legacy compatibility gate. Once reached it behaves as registration_mode
  // CLOSED. New deployments should keep this zero and use registration_mode.
  uint64 registration_cutoff_height = 9;
  EmergencyMode emergency_mode = 10;
  ScheduledParams pending = 11;
  uint64 pending_activation_height = 12;
  // Minimum notice period for governance changes that can make existing
  // transactions invalid. This launch parameter is immutable after genesis.
  uint64 governance_safety_delay_blocks = 13;
  // Maximum lifetime of either emergency pause. This launch parameter is
  // immutable after genesis and prevents an indefinite governance freeze.
  uint64 max_emergency_duration_blocks = 14;
  // Exclusive height at which the active emergency mode automatically returns
  // to NORMAL. Zero is required while emergency_mode is NORMAL.
  uint64 emergency_expires_height = 15;
  // Controls classic-account self-registration. Native ML-DSA accounts never
  // register pqcauth because their SDK signature already provides PQ safety.
  RegistrationMode registration_mode = 16;
}

// ScheduledParams contains every mutable, consensus-sensitive parameter. The
// complete bundle activates atomically at pending_activation_height.
message ScheduledParams {
  EnforcementMode enforcement_mode = 1;
  repeated Algorithm allowed_algorithms = 2;
  uint64 signature_verification_gas = 3;
  uint64 proof_verification_gas = 4;
  uint32 max_pqc_signers = 5;
  uint32 max_pqc_auth_bytes = 6;
  // Scheduled replacement for terminal key-record retention per role.
  uint32 max_retained_key_records_per_role = 7;
  // Scheduled legacy cutoff; see Params.registration_cutoff_height.
  uint64 registration_cutoff_height = 8;
  EmergencyMode emergency_mode = 9;
  // Computed by the module when an emergency is scheduled. Governance callers
  // cannot choose or extend this value directly.
  uint64 emergency_expires_height = 10;
  RegistrationMode registration_mode = 11;
}

// PQCKeyRecord is an append-only key record. inactive_from_height is exclusive;
// zero means that the key has no scheduled end height.
message PQCKeyRecord {
  string owner = 1;
  uint64 key_id = 2;
  Algorithm algorithm = 3;
  bytes public_key = 4;
  KeyRole role = 5;
  KeyStatus status = 6;
  uint64 created_height = 7;
  uint64 effective_height = 8;
  uint64 inactive_from_height = 9;
}

// AccountPolicy contains the current and H+1 pending authorization state.
message AccountPolicy {
  string owner = 1;
  uint64 current_signing_key_id = 2;
  uint64 pending_signing_key_id = 3;
  uint64 pending_effective_height = 4;
  bool self_enforced = 5;
  bool pending_self_enforced = 6;
  uint64 policy_version = 7;
  uint64 pending_policy_version = 8;
  uint64 recovery_key_id = 9;
  uint64 pending_recovery_key_id = 10;
}

// AccountKeySequence allocates monotonically increasing key identifiers.
message AccountKeySequence {
  string owner = 1;
  uint64 next_key_id = 2;
}

// AccountKeyHistory commits terminal key records that have been removed from
// current state. Accumulators are maintained independently for signing and
// recovery roles so rotation of one role cannot evict the other's live state.
message AccountKeyHistory {
  string owner = 1;
  KeyRole role = 2;
  uint64 compacted_count = 3;
  uint64 last_compacted_key_id = 4;
  bytes accumulator = 5;
}

// GenesisState defines pqcauth genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated PQCKeyRecord keys = 2 [(gogoproto.nullable) = false];
  repeated AccountPolicy policies = 3 [(gogoproto.nullable) = false];
  repeated AccountKeySequence key_sequences = 4 [(gogoproto.nullable) = false];
  repeated AccountKeyHistory key_histories = 5 [(gogoproto.nullable) = false];
}
