name: SDK candidate validation

on:
  workflow_dispatch:
  push:
    branches: [feature/wasm-readonly-archive, feature/pqcauth-sdk-keyring, fix/v1.0.0-ibc-amino-compat]
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - VERSION
      - CHANGELOG.md
      - Dockerfile
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: bridge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Required regressions and enabled simulations
        run: bash scripts/test-release-candidate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/*
          if-no-files-found: ignore

  linux:
    needs: tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Select candidate version policy
        run: echo "ALLOW_PRERELEASE=$(python3 scripts/candidate-prerelease.py)" >> "$GITHUB_ENV"
      - name: Build and execute candidate artifact
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export VERSION=$(cat VERSION)
          notes_flags=()
          if [[ "$ALLOW_PRERELEASE" == true ]]; then
            notes_flags+=(--allow-prerelease)
          fi
          python3 scripts/prepare-release-notes.py --tag "$VERSION" "${notes_flags[@]}" --output build-release-notes.md
          export COMMIT_SHA="$GITHUB_SHA"
          GO_VERSION=$(awk '$1 == "go" { print $2 }' go.mod)
          # Keep the output directory owned by the runner, not container root.
          mkdir -p release
          docker run --rm --platform "linux/${ARCH}" -e VERSION -e COMMIT_SHA -e GOTOOLCHAIN=local -e ALLOW_PRERELEASE \
            -v "$PWD:/src" -w /src "golang:${GO_VERSION}-alpine" \
            sh -ec 'apk add --no-cache bash build-base binutils curl git xz; bash scripts/build-bridge-release.sh'
          (cd release && sha256sum dorad-*.tar.gz > sha256sum.txt)
          printf 'commit=%s\narch=%s\ngo=%s\n' "$GITHUB_SHA" "$ARCH" "$GO_VERSION" > release/build-info.txt
      - name: Verify Dockerfile without publishing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --platform "linux/${ARCH}" --build-arg GIT_VERSION="$(cat VERSION)" --build-arg COMMIT_SHA="$GITHUB_SHA" --build-arg ALLOW_PRERELEASE="$ALLOW_PRERELEASE" -t bridge-ci .
          test "$(docker run --rm --platform "linux/${ARCH}" bridge-ci version)" = "$(cat VERSION)"
      - name: Rehearse PQC lifecycle with the packaged binary
        if: ${{ hashFiles('scripts/rehearse-pqcauth-lifecycle.py') != '' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build/rehearsal-bin
          tar -xzf "release/dorad-$(cat VERSION)-linux-${ARCH}.tar.gz" -C build/rehearsal-bin
          python3 scripts/rehearse-pqcauth-lifecycle.py \
            --binary "build/rehearsal-bin/dorad-$(cat VERSION)-linux-${ARCH}" \
            --work-dir build/pqcauth-rehearsal --rounds 4
      - name: Rehearse sequential v1.0.0 to v1.0.1 to PQCAuth upgrades
        if: ${{ matrix.arch == 'amd64' && hashFiles('scripts/rehearse-pqcauth-from-v101.py') != '' }}
        run: |
          set -euo pipefail
          mkdir -p build/upgrade-binaries
          curl --fail --location --retry 3 https://github.com/DoraFactory/doravota/releases/download/v1.0.0/dorad-v1.0.0-linux-amd64 -o build/upgrade-binaries/v100
          curl --fail --location --retry 3 https://github.com/DoraFactory/doravota/releases/download/v1.0.1/dorad-v1.0.1-linux-amd64 -o build/upgrade-binaries/v101
          echo '5c741ca406ee2ecb811dd62d83e9a446fee051e2947522525c2560a0a7ce968a  build/upgrade-binaries/v100' | sha256sum --check
          echo '04bd2d0dced7ccf1f993a70fb2be6b1718e0f1852c27f1bdeef0fa49eaea1696  build/upgrade-binaries/v101' | sha256sum --check
          chmod +x build/upgrade-binaries/v100 build/upgrade-binaries/v101
          GO_VERSION=$(awk '$1 == "go" { print $2 }' go.mod)
          docker run --rm --network none --cpus 3 --memory 7g -e GOMAXPROCS=2 \
            -e OLD_DORAD=/src/build/upgrade-binaries/v100 -e NEW_DORAD=/src/build/upgrade-binaries/v101 \
            -e PQC_DORAD="/src/build/rehearsal-bin/dorad-$(cat VERSION)-linux-amd64" \
            -e REHEARSAL_DIR=/src/build/pqcauth-sequential \
            -v "$PWD:/src" -w /src "golang:${GO_VERSION}-bookworm" \
            python3 scripts/rehearse-pqcauth-from-v101.py
      - name: Preserve sequential upgrade evidence (no keyrings)
        if: ${{ always() && matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@v4
        with:
          name: pqcauth-sequential-amd64
          path: |
            build/pqcauth-sequential/*.json
            build/pqcauth-sequential/*.log
          if-no-files-found: ignore
      - name: Preserve public rehearsal evidence (no keyrings)
        if: ${{ always() && hashFiles('scripts/rehearse-pqcauth-lifecycle.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pqcauth-rehearsal-${{ matrix.arch }}
          path: build/pqcauth-rehearsal/evidence/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-linux-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/sha256sum.txt
            release/build-info.txt
          if-no-files-found: error
