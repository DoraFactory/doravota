name: Auto Release with Changelog and Artifacts

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_NAME=${TAG_NAME#v}
          echo "Current Tag: $TAG_NAME"
          awk "/^## \\[${TAG_NAME}\\]/ {flag=1; next} /^## / {flag=0} flag" CHANGELOG.md > release_notes.md
          sed -i "s/^## \\[${TAG_NAME}\\]/## ${TAG_NAME}/" release_notes.md
          echo "Release Notes:"
          cat release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "❌ No release notes found for $TAG_NAME"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Test application and enabled simulations
        run: |
          go test ./... -count=1
          go test ./app -run '^TestApp(StateDeterminism|ImportExport|SimulationAfterImport)$' -Enabled=true -Seed=42 -NumBlocks=10 -BlockSize=5 -Commit=true -count=1 -timeout=180s -json > simulation-results.json
          python3 - <<'PYTEST'
          import json
          expected = {"TestAppStateDeterminism", "TestAppImportExport", "TestAppSimulationAfterImport"}
          passed = set()
          for line in open("simulation-results.json"):
              event = json.loads(line)
              if event.get("Action") == "pass" and event.get("Test") in expected:
                  passed.add(event["Test"])
          assert passed == expected, f"Simulations did not all pass: {expected - passed}"
          PYTEST

      - name: Enable target architecture emulation
        uses: docker/setup-qemu-action@v3

      - name: Verify Git state
        run: |
          echo "Current branch/tag:"
          git branch --show-current || echo "Not on a branch"
          git describe --tags || echo "No tags found"
          git log -1 --oneline

      - name: Build and smoke-test musl release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GO_VERSION=$(awk '$1 == "go" { print $2 }' go.mod)
          mkdir -p release
          for PLATFORM in linux/amd64 linux/arm64; do
            docker run --rm --platform "$PLATFORM" \
              -e VERSION -e COMMIT_SHA -e GOTOOLCHAIN=local \
              -v "$PWD:/src" -w /src "golang:${GO_VERSION}-alpine" \
              sh -ec 'apk add --no-cache bash build-base binutils curl git; bash scripts/build-bridge-release.sh'
          done
          (cd release && sha256sum dorad-* > sha256sum.txt)

      - name: Set Release Date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }} - ${{ env.RELEASE_DATE }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == '0.5.0' || contains(github.ref_name, '-rc.') }}
          make_latest: false
          draft: ${{ contains(github.ref_name, '-rc.') }}
          body_path: ./release_notes.md
          files: |
            release/dorad-*linux-amd*
            release/dorad-*linux-arm*
            release/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}