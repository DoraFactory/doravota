name: Release verified Linux amd64 artifacts

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release identity and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release-notes.py --tag "$RELEASE_TAG"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Required regressions and enabled simulations
        run: bash scripts/test-release-candidate.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/*.jsonl
          if-no-files-found: ignore

      - name: Build and smoke-test static release binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GO_VERSION=$(awk '$1 == "go" { print $2 }' go.mod)
          mkdir -p release
          # v1.0.0 distribution is limited to the validated Linux amd64 target.
          docker run --rm --platform linux/amd64 \
            -e VERSION -e COMMIT_SHA -e GOTOOLCHAIN=local \
            -v "$PWD:/src" -w /src "golang:${GO_VERSION}-alpine" \
            sh -ec 'apk add --no-cache bash binutils; bash scripts/build-bridge-release.sh'
          (cd release && sha256sum "dorad-${VERSION}-linux-amd64" "dorad-${VERSION}-linux-amd64.tar.gz" > sha256sum.txt)
          printf 'version=%s\ncommit=%s\narch=linux/amd64\ngo=%s\nupgrade_plan=v1.0.0\n' \
            "$VERSION" "$COMMIT_SHA" "$GO_VERSION" > release/build-info.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          make_latest: false
          draft: false
          fail_on_unmatched_files: true
          body_path: ./release_notes.md
          files: |
            release/dorad-${{ github.ref_name }}-linux-amd64
            release/dorad-${{ github.ref_name }}-linux-amd64.tar.gz
            release/sha256sum.txt
            release/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
