name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - pqc-auth

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        goos: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        if: matrix.goos == 'ubuntu-latest'
        run: go vet ./...
      - name: PQC auth race detector
        if: matrix.goos == 'ubuntu-latest'
        run: go test -race ./x/pqcauth/...
      - name: PQC auth coverage gate
        if: matrix.goos == 'ubuntu-latest'
        run: bash scripts/check-pqcauth-coverage.sh
        env:
          PQCAUTH_COVERAGE_MIN: '80.0'

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Build
        run: go build -o /tmp/dorad-linux-${{ matrix.goarch }} ./cmd/dorad
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
